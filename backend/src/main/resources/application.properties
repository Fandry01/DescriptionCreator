spring.application.name=DescriptionCreator
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

shopify.shop-domain=${SHOPIFY_SHOP_DOMAIN:}
shopify.client-id=${SHOPIFY_CLIENT_ID:}
shopify.client-secret=${SHOPIFY_CLIENT_SECRET:}
shopify.api-version=${SHOPIFY_API_VERSION:2026-07}
shopify.redirect-uri=${SHOPIFY_REDIRECT_URI:http://localhost:8080/api/shopify/callback}

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5-mini}

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.display-name=${APP_ADMIN_DISPLAY_NAME:}
app.usage.monthly-generation-limit=${APP_MONTHLY_GENERATION_LIMIT:500}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
