# Load local environment values only when the dev profile is active.
# The first location applies when Maven runs from backend/; the second from the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Persistence is not wired yet; keep local OAuth development independent of a database.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
